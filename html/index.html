<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>50 preguntas sobre HTML — Índice de ejemplos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>50 preguntas sobre <span>HTML</span> — Ejemplos</h1>
      <p>
        Índice de los 50 ejemplos en <code>codigo/</code>. Hacé clic para abrir
        cada uno.
      </p>
    </header>
    <main>
      <h2>Básico (01–17)</h2>
      <ul class="grid" id="grid-basico" aria-busy="true">
        <li class="loading"><span class="spinner" aria-hidden="true"></span><span>Cargando…</span></li>
      </ul>

      <h2>Intermedio (18–34)</h2>
      <ul class="grid" id="grid-intermedio" aria-busy="true">
        <li class="loading"><span class="spinner" aria-hidden="true"></span><span>Cargando…</span></li>
      </ul>

      <h2>Avanzado (35–50)</h2>
      <ul class="grid" id="grid-avanzado" aria-busy="true">
        <li class="loading"><span class="spinner" aria-hidden="true"></span><span>Cargando…</span></li>
      </ul>

      <p id="error" hidden></p>
      <noscript>
        <p>Activá JavaScript para ver el índice de ejemplos.</p>
      </noscript>
    </main>
    <footer>
      50 ejemplos — Abrí con Live Server (el fetch de ejemplos.json no funciona
      con file://).
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
