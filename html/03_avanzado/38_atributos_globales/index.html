<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué son los atributos globales de HTML?</title>
</head>
<body>
  <h1 id="titulo-principal" class="titulo" lang="es">Bienvenida</h1>

  <p title="Nota adicional al pasar el cursor" dir="ltr">
    Este párrafo lleva varios atributos globales.
  </p>

  <p hidden>Este párrafo no se muestra en la página.</p>

  <p data-autor="ana" data-edicion="3">
    Párrafo con atributos de datos personalizados.
  </p>
</body>
</html>
