<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué son los atributos ARIA y cuándo conviene usarlos?</title>
</head>
<body>
<p>
  <label for="usuario">Usuario:</label>
  <input type="text" id="usuario" name="usuario" required
         aria-describedby="ayuda-usuario">
</p>
<p id="ayuda-usuario">El usuario debe tener entre 4 y 12 caracteres.</p>
</body>
</html>
