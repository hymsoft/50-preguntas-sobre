<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué son los atributos data-* y para qué se usan?</title>
</head>
<body>
<ul>
  <li data-producto="123" data-precio="25.50">Auriculares inalámbricos</li>
  <li data-producto="124" data-precio="19.90">Teclado compacto</li>
  <li data-producto="125" data-precio="45.00">Monitor 24 pulgadas</li>
</ul>

<button type="button" data-accion="abrir-carrito" data-carrito="carrito-principal">
  Ver carrito
</button>
</body>
</html>
