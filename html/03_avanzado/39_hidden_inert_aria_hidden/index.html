<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué diferencia existe entre hidden, inert y aria-hidden?</title>
</head>
<body>
<p hidden>Este aviso está oculto del renderizado: no se ve en la página.</p>

<div inert>
  <p>Esta zona está inutilizada mientras se procesa una acción.</p>
  <button type="button">Botón inerte</button>
</div>

<p>Paso siguiente <span aria-hidden="true">→</span> continuar</p>
</body>
</html>
