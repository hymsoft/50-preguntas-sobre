<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Cómo se incorporan datos estructurados (microdatos) en HTML?</title>
</head>
<body>
<article itemscope itemtype="https://vocabulario-ejemplo.org/Persona">
  <h1 itemprop="nombre">Ana García</h1>
  <p>
    Puesto: <span itemprop="puesto">Editora técnica</span>
  </p>
  <p>
    Correo: <span itemprop="correo">ana@ejemplo.org</span>
  </p>
</article>
</body>
</html>
