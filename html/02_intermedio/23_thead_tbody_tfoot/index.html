<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Cómo se agrupan las filas de una tabla en cabecera, cuerpo y pie?</title>
</head>
<body>
<table>
  <caption>Ventas del año 2026</caption>
  <thead>
    <tr>
      <th scope="col">Trimestre</th>
      <th scope="col">Ventas</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Primero</td>
      <td>1200</td>
    </tr>
    <tr>
      <td>Segundo</td>
      <td>1500</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <th scope="row">Total</th>
      <td>2700</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
