<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué diferencia existe entre <article> y <section>, y cuándo conviene usar <section> en vez de <div>?</title>
</head>
<body>
<article>
  <h2>Receta de pan casero</h2>
  <p>Esta receta se puede compartir de forma independiente.</p>

  <section>
    <h3>Ingredientes</h3>
    <ul>
      <li>Harina</li>
      <li>Agua</li>
      <li>Levadura</li>
    </ul>
  </section>

  <section>
    <h3>Preparación</h3>
    <p>Pasos para preparar el pan...</p>
  </section>
</article>
</body>
</html>
