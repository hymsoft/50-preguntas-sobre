<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Cómo se combinan celdas en una tabla?</title>
</head>
<body>
<table>
  <tr>
    <th scope="col">Equipo</th>
    <th scope="col">Jugador</th>
    <th scope="col">Goles</th>
  </tr>
  <tr>
    <th scope="row" rowspan="2">Equipo A</th>
    <td>Laura</td>
    <td>3</td>
  </tr>
  <tr>
    <td>Pedro</td>
    <td>2</td>
  </tr>
</table>
</body>
</html>
