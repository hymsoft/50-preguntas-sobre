<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Cómo se crean listas ordenadas y desordenadas, y cuál es la diferencia entre <ol>, <ul> y <li>?</title>
</head>
<body>
<ul>
  <li>Manzanas</li>
  <li>Peras</li>
  <li>Naranjas</li>
</ul>

<ol>
  <li>Preparar los ingredientes</li>
  <li>Mezclar la masa</li>
  <li>Hornear</li>
</ol>
</body>
</html>
