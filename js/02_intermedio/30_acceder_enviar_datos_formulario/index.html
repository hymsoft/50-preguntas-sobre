<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Cómo se accede y se envían los datos de un formulario con JavaScript?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="formulario-registro">
    <input type="text" name="nombre">
    <input type="email" name="email">
    <input type="number" name="edad">
    <label><input type="checkbox" name="intereses" value="musica"> Música</label>
    <label><input type="checkbox" name="intereses" value="deporte"> Deporte</label>
    <input type="tel" name="telefono">
    <button type="submit">Enviar</button>
  </form>
  <script src="script.js"></script>
</body>
</html>
