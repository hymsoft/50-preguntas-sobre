<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de métodos CSS</title>

  <!-- Método 3: Externo (recomendado) -->
  <link rel="stylesheet" href="style.css">

  <!-- Método 2: Interno -->
  <style>
    .internos {
      color: green;
      font-size: 1.2rem;
      border: 1px solid green;
      padding: 10px;
    }
  </style>
</head>
<body>
  <!-- Método 1: En línea -->
  <h1 style="color: navy; font-size: 2rem;">Título con estilos en línea</h1>

  <!-- Método 2: Estilo interno -->
  <p class="internos">Párrafo con estilos internos</p>

  <!-- Método 3: Estilo externo (definido en style.css) -->
  <p class="externo">Párrafo con estilos externos</p>
</body>
</html>
