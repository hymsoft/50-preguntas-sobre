<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aspect-ratio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Perfil</h1>
  <img class="avatar" src="https://picsum.photos/800/600" alt="Avatar del usuario">

  <h2>Video</h2>

  <h2>Galería</h2>
  <div class="galeria">
    <img class="galeria-item" src="https://picsum.photos/800/600" alt="Foto 1">
    <img class="galeria-item" src="https://picsum.photos/800/600" alt="Foto 2">
    <img class="galeria-item" src="https://picsum.photos/800/600" alt="Foto 3">
  </div>

</html>
