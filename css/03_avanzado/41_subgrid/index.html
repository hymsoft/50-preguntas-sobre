<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subgrid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="galeria">
    <div class="tarjeta">
      <img class="tarjeta-imagen" src="https://picsum.photos/800/600" alt="Foto 1">
      <h3 class="tarjeta-titulo">Tarjeta 1</h3>
      <p class="tarjeta-descripcion">Una descripción breve.</p>
    </div>
    <div class="tarjeta">
      <img class="tarjeta-imagen" src="https://picsum.photos/800/600" alt="Foto 2">
      <h3 class="tarjeta-titulo">Tarjeta 2</h3>
      <p class="tarjeta-descripcion">Una descripción más extensa que ocupa varias líneas y por eso los títulos se desalinearían sin subgrid.</p>
    </div>
    <div class="tarjeta">
      <img class="tarjeta-imagen" src="https://picsum.photos/800/600" alt="Foto 3">
      <h3 class="tarjeta-titulo">Tarjeta 3</h3>
      <p class="tarjeta-descripcion">Otra descripción.</p>
    </div>
  </div>
</body>
</html>
