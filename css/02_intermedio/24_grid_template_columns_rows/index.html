<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid — Columnas y Filas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-1">
    <div>Izquierda</div>
    <div>Centro</div>
    <div>Derecha</div>
  </div>

  <div class="grid-2">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
  </div>

  <div class="grid-responsive">
    <div>Artículo 1</div>
    <div>Artículo 2</div>
    <div>Artículo 3</div>
    <div>Artículo 4</div>
    <div>Artículo 5</div>
  </div>

  <div class="grid-minmax">
    <div>C1</div>
    <div>C2</div>
    <div>C3</div>
    <div>C4</div>
    <div>C5</div>
    <div>C6</div>
  </div>
</body>
</html>
