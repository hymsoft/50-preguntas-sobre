<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudoclases CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="boton">Botón</button>

  <table>
    <tr><td>Fila 1</td></tr>
    <tr><td>Fila 2</td></tr>
    <tr><td>Fila 3</td></tr>
    <tr><td>Fila 4</td></tr>
  </table>

  <div>
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/800/600" alt="Imagen de la tarjeta">
  </div>
  <div class="card">
    <p>Tarjeta sin imagen.</p>
  </div>
</body>
</html>
